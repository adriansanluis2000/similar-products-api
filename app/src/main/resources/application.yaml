spring:
  application:
    name: similar-products-api
  http:
    serviceclient:
      products:
        base-url: http://localhost:3001
        connect-timeout: 1s
        read-timeout: 6s
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 5000

similar-products:
  budget: 1s
  cache:
    maximum-size: 10000
    products:
      found: 60s
      not-found: 5m
      unavailable: 5s
      refresh: 30s
    similar-ids:
      found: 10m
      not-found: 5m
      refresh: 5m

logging:
  level:
    # Caffeine logs every failed load or refresh with a stack trace. Those failures are expected and handled here.
    com.github.benmanes.caffeine: error
