spring:
  application:
    name: similar-products-api
  http:
    serviceclient:
      products:
        base-url: http://localhost:3001
        connect-timeout: 1s
        read-timeout: 6s
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 5000

similar-products:
  budget: 1s
  cache:
    maximum-size: 10000
    products:
      found: 60s
      not-found: 5m
      unavailable: 5s
      refresh: 30s
    similar-ids:
      found: 10m
      not-found: 5m
      refresh: 5m
  upstream:
    max-concurrent-calls: 100
    retry-backoff: 100ms
    circuit-breaker:
      failure-rate-threshold: 50
      minimum-number-of-calls: 20
      sliding-window: 10s
      wait-in-open-state: 10s

logging:
  level:
    # Caffeine logs every failed load or refresh with a stack trace. Those failures are expected and handled here.
    com.github.benmanes.caffeine: error

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
